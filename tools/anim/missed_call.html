<!doctype html><html><head><meta charset="utf-8"><title>Missed call before/after</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f3f7fb;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#0f2438;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss03'}
.topbar{position:absolute;left:0;top:0;width:100%;height:10px;background:linear-gradient(90deg,#00437A 70%,#F47920 70%)}
#chip{position:absolute;left:120px;top:150px;padding:12px 30px;border-radius:40px;font-weight:700;font-size:30px;letter-spacing:.16em;color:#fff}
#cap{position:absolute;left:120px;top:290px;width:900px}
#cap1{font-family:'Inter Display',Inter,sans-serif;font-size:88px;font-weight:700;line-height:1.07;letter-spacing:-.028em}
#cap2{margin-top:28px;font-size:42px;font-weight:500;line-height:1.3;letter-spacing:-.005em;color:#2c4861}
#ill{position:absolute;left:120px;bottom:60px;font-size:26px;font-weight:500;color:#5f7890}
#logo{position:absolute;right:60px;bottom:36px;height:84px;background:#fff;border-radius:20px;padding:6px 18px;box-shadow:0 4px 18px rgba(0,67,122,.15)}
#phone{position:absolute;left:1120px;top:60px;width:470px;height:960px;border-radius:70px;background:#0d1b2a;box-shadow:0 30px 80px rgba(0,67,122,.35)}
#screen{position:absolute;left:14px;top:14px;width:442px;height:932px;border-radius:58px;overflow:hidden;background:#fff}
.layer{position:absolute;inset:0;opacity:0}
.status{height:54px;padding:18px 34px 0;display:flex;justify-content:space-between;font-weight:600;font-size:21px}
/* results */
#results{background:#f6f8fb}
.search{margin:6px 20px 14px;height:58px;border-radius:30px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;padding:0 22px;font-size:22px;font-weight:500;color:#1f3347;white-space:nowrap}
.map{margin:0 0 6px;height:210px;background:#dfe9f0;position:relative;overflow:hidden}
.map i{position:absolute;background:#fff}
.pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#e5483b}
.card{margin:12px 16px;padding:18px 20px;border-radius:22px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.card h3{font-size:28px;font-weight:700;letter-spacing:-.01em}.card p{font-size:20px;font-weight:500;color:#445a6e;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;text-align:center;padding:13px 0;border-radius:30px;font-size:22px;font-weight:600;background:#e8f1fb;color:#00437A}
.btn.call{background:#00437A;color:#fff}
/* call screens */
.callscr{background:linear-gradient(180deg,#1b2b3c,#0d1b2a);color:#fff;text-align:center}
.av{width:150px;height:150px;border-radius:50%;margin:150px auto 28px;background:#2d4a66;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800}
.cn{font-size:38px;font-weight:700;letter-spacing:-.01em;padding:0 20px}.cs{margin-top:18px;font-size:30px;font-weight:500;color:#cfdbe6;min-height:40px}
.end{position:absolute;left:50%;bottom:90px;width:92px;height:92px;margin-left:-46px;border-radius:50%;background:#e5483b;display:flex;align-items:center;justify-content:center;font-size:40px}
/* messages */
#msgs{background:#f6f8fb}
.mh{height:120px;background:#fff;border-bottom:1px solid #e1e8ef;padding-top:54px;text-align:center;font-size:28px;font-weight:700;color:#00437A}
.th{padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.b{max-width:82%;padding:16px 22px;border-radius:26px;font-size:24px;font-weight:500;line-height:1.38;opacity:0}
.b.in{align-self:flex-start;background:#e6ecf2}.b.out{align-self:flex-end;background:#F47920;color:#fff}
.inp{position:absolute;left:14px;right:14px;bottom:26px;height:64px;border-radius:32px;background:#fff;border:1px solid #d5dee7;padding:0 24px;display:flex;align-items:center;font-size:24px;font-weight:500}
#banner{position:absolute;left:26px;right:26px;top:500px;border-radius:32px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.40);padding:30px 28px 34px;opacity:0;z-index:6}
#banner .hd{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.08em;color:#5f7890}#banner .ic{width:32px;height:32px;border-radius:8px;background:#34c759;display:inline-block}#banner .hd span:last-child{margin-left:auto;font-weight:500;letter-spacing:0}#banner b{display:block;margin-top:18px;font-size:30px;font-weight:700}#banner .tx{font-size:28px;font-weight:500;margin-top:10px;line-height:1.32}
#scrim{position:absolute;inset:0;background:rgba(13,27,42,.55);opacity:0;z-index:5}
#tap{position:absolute;width:70px;height:70px;border-radius:50%;border:5px solid #F47920;background:rgba(244,121,32,.25);opacity:0;z-index:9;transform:translate(-50%,-50%)}
</style></head><body>
<div class="topbar"></div>
<div id="chip"></div>
<div id="cap"><div id="cap1"></div><div id="cap2"></div></div>
<div id="ill">Illustration. Not a real customer or call.</div>
<img id="logo" src="../../brand/logo.png">
<div id="phone"><div id="screen">
 <div id="results" class="layer">
  <div class="status"><span id="clock">9:02 PM</span><span>5G ▮▮▮</span></div>
  <div class="search">🔍&nbsp; <span id="q"></span></div>
  <div class="map fade"><i style="left:-10px;top:70px;width:520px;height:16px;transform:rotate(-8deg)"></i><i style="left:120px;top:-10px;width:16px;height:300px;transform:rotate(12deg)"></i><i style="left:260px;top:20px;width:12px;height:300px;transform:rotate(-5deg)"></i><i style="left:-10px;top:150px;width:520px;height:12px;transform:rotate(4deg)"></i>
   <div class="pin" style="left:140px;top:84px"></div><div class="pin" style="left:300px;top:128px;background:#7b93a8"></div></div>
  <div class="card fade"><h3 id="n1">Your Company</h3><p id="p1"></p><div class="btns"><div class="btn call" id="btnCall1">Call</div><div class="btn">Website</div><div class="btn">Directions</div></div></div>
  <div class="card fade"><h3 id="n2">Next Plumbing Co</h3><p id="p2"></p><div class="btns"><div class="btn call" id="btnCall2">Call</div><div class="btn">Website</div><div class="btn">Directions</div></div></div>
  <div id="scrim"></div><div id="banner"><div class="hd"><span class="ic"></span><span>MESSAGES</span><span>now</span></div><b id="bn">Your Company</b><div class="tx" id="bt">Sorry we missed your call! How can we help you?</div></div>
 </div>
 <div id="call1" class="layer callscr"><div class="status" style="color:#fff"><span>9:02 PM</span><span></span></div><div class="av" id="av1">Y</div><div class="cn" id="cn1">Your Company</div><div class="cs" id="cs1"></div><div class="end">✆</div></div>
 <div id="call2" class="layer callscr"><div class="status" style="color:#fff"><span>9:03 PM</span><span></span></div><div class="av" id="av2">N</div><div class="cn" id="cn2">Next Plumbing Co</div><div class="cs" id="cs2"></div><div class="end">✆</div></div>
 <div id="msgs" class="layer"><div class="mh" id="mh">Your Company</div><div class="th"><div class="b in" id="b1"></div><div class="b out" id="b2"></div><div class="b in" id="b3"></div></div><div class="inp" id="inp"></div></div>
</div></div><div id="tap"></div>
<svg id="handsvg" width="1920" height="1080" style="position:absolute;left:0;top:0;z-index:20;pointer-events:none;overflow:visible"><g id="hand" opacity="0">
 <rect x="-95" y="520" width="270" height="700" rx="30" fill="#00437A"/>
 <path d="M-66 235 Q-96 320 -74 430 Q-62 520 -22 540 L135 540 Q158 440 146 335 Q143 255 112 218 Z" fill="#f0c4a0"/>
 <rect x="30" y="118" width="50" height="150" rx="25" fill="#ecbd98"/>
 <rect x="78" y="138" width="48" height="136" rx="24" fill="#e6b490"/>
 <rect x="120" y="165" width="42" height="112" rx="21" fill="#e0ad88"/>
 <rect x="-94" y="190" width="48" height="140" rx="24" fill="#eebe99" transform="rotate(26 -70 200)"/>
 <rect x="-26" y="0" width="54" height="285" rx="27" fill="#f4cdac"/>
 <rect x="-16" y="9" width="34" height="40" rx="17" fill="#fbe9db"/>
 <path d="M-22 230 Q1 250 24 230" stroke="#e2b18c" stroke-width="3" fill="none" opacity=".7"/>
</g></svg>
<script>
const P=new URLSearchParams(location.search);
const MODE=P.get('mode')||'before', BIZ=P.get('biz')||'Your Company', COMP=P.get('comp')||'Another Plumbing Company';
const Q=P.get('q')||'emergency plumber near me', CAT=P.get('cat')||'Plumber';
const JOB=P.get('job')||'a $12,000 repipe', CUST=P.get('cust')||'Water heater just burst!';
const REPLY=P.get('reply')||'That sounds stressful. Is the water still running? What is the address?';
const END=18.5;
const $=id=>document.getElementById(id);
$('n1').textContent=BIZ;$('cn1').textContent=BIZ;$('av1').textContent=BIZ[0];$('bn').textContent=BIZ;$('mh').textContent=BIZ;
$('n2').textContent=COMP;$('cn2').textContent=COMP;$('av2').textContent=COMP[0];
$('p1').textContent='★ 4.9 (212) · '+CAT+' · Open 24 hours';$('p2').textContent='★ 4.7 (180) · '+CAT+' · Open now';
$('b1').textContent=`Hi! Sorry we missed your call. This is the virtual assistant for ${BIZ}. How can we help you?`;
$('b2').textContent=CUST;$('b3').textContent=REPLY;
const ramp=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const centre=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
const J=JOB[0].toUpperCase()+JOB.slice(1);
const CAPS=MODE==='before'?[
 [0,2.4,'A homeowner needs help now.',`They search "${Q}".`],
 [2.4,7.8,'They tap call on your business.','It rings. And rings.'],
 [7.8,9.6,'No answer.','No voicemail. No second chance.'],
 [9.6,11.8,'So they tap the next company.',''],
 [11.8,15,'That company answers.',''],
 [15,99,'Job gone.',`${J}, won by whoever picked up.`]]:[
 [0,2.4,'The same homeowner. The same search.','Now your business has missed call text back.'],
 [2.4,7.8,'They tap call on your business.','It rings. Nobody answers.'],
 [7.8,9.4,'No answer.',''],
 [9.4,10.4,'But before they tap the next company...',''],
 [10.4,12.4,'A text pops up from your business.','Instantly.'],
 [12.4,15,'The assistant gets the details.',''],
 [15,99,'The conversation has started.','You call back first.']];
const T={tap1:3.7,call1:3.9,ring:4.7,noans:7.8,back:8.8,
  tap2:MODE==='before'?10.45:11.2,after:MODE==='before'?10.8:11.5,conn:11.8};
const REST=[1900,1300];
function handPath(){            // [time, x, y] keyframes, resolved against live DOM positions
  const c1=centre($('btnCall1')),c2=centre($('btnCall2')),sr=$('screen').getBoundingClientRect(),b=$('banner'),bn=[sr.left+sr.width/2,sr.top+b.offsetTop+b.offsetHeight/2];
  const first=[[2.6,...REST],[3.6,c1[0],c1[1]+6],[3.95,c1[0],c1[1]+6],[4.9,...REST]];
  const second=MODE==='before'
   ?[[9.0,...REST],[10.35,c2[0],c2[1]+6],[10.75,c2[0],c2[1]+6],[11.8,...REST]]
   :[[9.0,...REST],[9.9,c2[0]+70,c2[1]+70],[10.5,c2[0]+55,c2[1]+55],[11.15,bn[0],bn[1]+10],[11.5,bn[0],bn[1]+10],[12.4,...REST]];
  return first.concat(second);
}
function handAt(t){
  const k=handPath();
  if(t<k[0][0]||t>k[k.length-1][0]) return null;
  for(let i=0;i<k.length-1;i++){const a=k[i],b=k[i+1];
    if(t>=a[0]&&t<=b[0]){ if(a[0]>=4.9&&b[0]<9.0) return null; const f=ease(ramp(t,a[0],b[0]));return[a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}}
  return null;
}
function render(t){
 const c=$('chip');c.textContent=MODE==='before'?'BEFORE':'AFTER';c.style.background=MODE==='before'?'#7b93a8':'#1f9d55';
 const cur=CAPS.find(x=>t>=x[0]&&t<x[1])||CAPS[CAPS.length-1];
 $('cap1').textContent=cur[2];$('cap2').textContent=cur[3];
 const f=ramp(t,cur[0],cur[0]+.35);$('cap').style.opacity=f;$('cap').style.transform=`translateY(${(1-f)*14}px)`;
 $('cap1').style.color=(cur[2]==='No answer.'||cur[2]==='Job gone.')?'#c0392b':(cur[2]==='The conversation has started.'?'#1f9d55':'#13293d');
 // screens
 const inRes=(t<T.call1)||(t>=T.back&&t<T.after);
 layer('results',inRes?1:0);layer('call1',(t>=T.call1&&t<T.back)?1:0);layer('call2',(MODE==='before'&&t>=T.after)?1:0);layer('msgs',(MODE==='after'&&t>=T.after)?1:0);
 // search typing, then results appear
 const typedQ=Q.slice(0,Math.floor(Math.max(0,t-.5)*16));$('q').textContent=t<2.0?(typedQ+(Math.floor(t*3)%2&&t<2?'|':'')):Q;
 const show=ramp(t,2.1,2.7);document.querySelectorAll('.fade').forEach(e=>{e.style.opacity=show;e.style.transform=`translateY(${(1-show)*18}px)`});
 // calls
 const dots='.'.repeat(Math.floor(t*2.5)%4);
 $('cs1').textContent=t<T.ring?'Calling'+dots:(t<T.noans?'Ringing'+dots:'No answer');$('cs1').style.color=t>=T.noans?'#ff6b5e':'#b9c8d6';
 const k=t-T.conn;$('cs2').textContent=t<T.conn?'Calling'+dots:`Connected  0:0${Math.min(9,Math.max(0,Math.floor(k)))}`;$('cs2').style.color=t>=T.conn?'#5fe39b':'#b9c8d6';
 // banner (after): pops just before the hand reaches the next company
 if(MODE==='after'){const bb=ramp(t,9.9,10.3);const pop=.82+.18*(bb<1?Math.sin(bb*Math.PI/2)*1.06:1);const live=t<T.after;$('banner').style.opacity=live?bb:0;$('banner').style.transform=`scale(${Math.min(1.04,pop)})`;$('scrim').style.opacity=live?bb:0}else{$('banner').style.opacity=0;$('scrim').style.opacity=0}
 // messages
 const pop=(id,a)=>{const v=ramp(t,a,a+.35);$(id).style.opacity=v;$(id).style.transform=`translateY(${(1-v)*16}px)`};
 pop('b1',11.6);pop('b2',14.6);pop('b3',15.4);
 let typed='';if(t>=12.6&&t<14.6)typed=CUST.slice(0,Math.floor((t-12.6)*14));$('inp').textContent=typed?typed+(Math.floor(t*3)%2?'|':''):'';
 // hand + tap ripple
 const pos=handAt(t),h=$('hand');
 if(pos){const press=(t>=T.tap1&&t<T.tap1+.25)||(t>=T.tap2&&t<T.tap2+.25);const pr=press?10:0;
   h.setAttribute('opacity',Math.min(1,ramp(t,2.6,3.0)+ (t>=9?1:0),1));
   h.setAttribute('transform',`translate(${pos[0]+pr*.35},${pos[1]+pr}) rotate(-20) scale(${press?.97:1})`);h.setAttribute('opacity',1);
   const ring=(t>=T.tap1&&t<T.tap1+.5)||(t>=T.tap2&&t<T.tap2+.5);
   if(ring){const ts=(t<T.tap2-1?T.tap1:T.tap2);$('tap').style.opacity=1-ramp(t,ts+.12,ts+.5);$('tap').style.left=pos[0]+'px';$('tap').style.top=pos[1]+'px';$('tap').style.transform=`translate(-50%,-50%) scale(${.6+ramp(t,ts,ts+.5)*.9})`}else $('tap').style.opacity=0;
 }else{h.setAttribute('opacity',0);$('tap').style.opacity=0}
}
function layer(id,o){$(id).style.opacity=o}
window.END=END;window.renderAt=render;render(0);
</script></body></html>
