name: MCTB dialer
# Scheduled runs happen only when the repo variable MCTB_ACTIONS_LIVE = true. Manual runs always work (live=false is a dry run).
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Dial for real? (false = dry run that only prints the plan)"
        default: "false"
  schedule:
    - cron: "45 22 * * 1-4"   # 6:45 PM Eastern in daylight time
    - cron: "45 23 * * 1-4"   # 6:45 PM Eastern in standard time (the other one finds the window too far away and exits)
concurrency:
  group: mctb-dialer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  dial:
    if: github.event_name == 'workflow_dispatch' || vars.MCTB_ACTIONS_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
      GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Dial
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.live }}" = "true" ]; then
            python -m mce dial --live --limit 80 --wait-minutes 30
          else
            python -m mce dial --limit 80
          fi
      - name: Status after the run
        if: always()
        run: python -m mce status || true
